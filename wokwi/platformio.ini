; Optional: only if you build locally with PlatformIO / the Wokwi VS Code extension.
; Put sketch.ino as src/main.cpp and the ll_*.h/.cpp + esp_flash.h files in src/.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
